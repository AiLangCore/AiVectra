name: AiVectra CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
      - "hotfix/**"
      - "codex/**"
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sdk:
    name: sdk-linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Script syntax
        shell: bash
        run: |
          set -euo pipefail
          find ./scripts -type f -name '*.sh' -print | sort | xargs -I{} bash -n {}
          bash -n ./scripts/aivectra

      - name: Node ID check
        shell: bash
        run: ./scripts/check-node-ids.sh

      - name: Package smoke
        shell: bash
        run: |
          set -euo pipefail
          package_dir=".tmp/aivectra-ci-package"
          rm -rf "$package_dir"
          mkdir -p "$package_dir/bin" "$package_dir/src" "$package_dir/SPEC" "$package_dir/test-fixtures"
          cp ./scripts/aivectra "$package_dir/bin/aivectra"
          chmod +x "$package_dir/bin/aivectra"
          cp -R ./src/AiVectra "$package_dir/src/AiVectra"
          cp -R ./src/AiVectra.Cli "$package_dir/src/AiVectra.Cli"
          cp -R ./SPEC/. "$package_dir/SPEC/"
          cp -R ./test-fixtures/. "$package_dir/test-fixtures/"
          cp ./README.md ./LICENSE "$package_dir/"
          "$package_dir/bin/aivectra" --help >/dev/null

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: aivectra-sdk-linux
          path: .tmp/aivectra-ci-package

  publish-release:
    name: publish-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - sdk
    permissions:
      contents: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: aivectra-sdk-linux
          path: ./release-artifacts/aivectra-sdk-linux

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./release-assets
          (cd ./release-artifacts/aivectra-sdk-linux && tar -czf ../../release-assets/aivectra-sdk-linux.tar.gz .)
          (cd ./release-assets && sha256sum *.tar.gz > SHA256SUMS.txt)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
