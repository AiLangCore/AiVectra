schema = "ailang.package-source.v1"
name = "aivectra"
version = "0.0.1-beta.7"
types = ["library", "tool", "template"]

[dependencies]
std-app = "0.0.1-alpha.3"
std-ui-input = "0.0.1-alpha.7"

[libraries.app]
namespace = "aivectra.app"
entry = "src/AiVectra/src/app.aos"
exports = [
  "aivectraApp",
  "aivectraAppName",
  "aivectraAppSpec",
  "aivectraAppInit",
  "aivectraAppUpdate",
  "aivectraAppRender",
  "aivectraAppWindowWidth",
  "aivectraAppWindowHeight",
  "aivectraAppMenuBar",
  "aivectraAppWithMenuBar",
  "aivectraStartEvent",
  "aivectraRunContext",
  "aivectraRunMode",
  "aivectraRunState",
  "aivectraRunShouldSnapshot",
  "aivectraRunWindow",
  "aivectraResizeEvent",
  "aivectraFrameAppEvent",
  "aivectraRun",
  "aivectraMenuItem",
  "aivectraMenuSeparator",
  "aivectraMenuBarItem",
  "aivectraMenuBar",
  "aivectraDefaultApplicationMenu",
  "aivectraDefaultMenuBar",
  "aivectraMenuBarItemTitle",
  "aivectraMenuItemCommand",
  "aivectraMenuItemRole",
]

[libraries.ui]
namespace = "aivectra.ui"
entry = "src/AiVectra/src/lib.aos"
exports = []

[libraries.cli]
namespace = "aivectra.cli"
entry = "src/AiVectra.Cli/src/app.aos"
exports = []
